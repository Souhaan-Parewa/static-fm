<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>DEAD AIR — 87.3 FM</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config= {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"VT323"', '"Courier New"','monospace'],
                        body: ['"Share Tech Mono"', 'monospace'],
                    },
                    colors: {
                        void: '#050508',
                        crt: '#0a0d0f',
                        panel: '#0d1117',
                        border: '#1a2030',
                        dim: '#1e2d1e',
                        green: '#00ff410',
                        dgreen: '#00aa2a',
                        fgreen: '#005c17',
                        red: '#ff2020',
                        amber: '#ffaa00',
                        ghost: '334433',
                    },
                    Keyframes: {
                        scaline: {
                            '0%': {top: '-10%' },
                            '100%': {top: '110%'},
                        },
                        blink: {
                            '0%,49%': {opacity: '1'},
                            '50%,100%': {opacity: '0'},
                        },
                        flicker: {
                            '0%,100%': {opacity: '1'},
                            '92%': {opacity: '1'},
                            '93%': {opacity: '0.4'},
                            '94%': {opacity: '1'},
                            '96%': {opacity: '0.7'},
                            '97%': {opacity: '1'},
                        },
                        glow: {
                            '0%,100%': {textShadow: '0 0 6px #00ff41, 0 0 12px #00ff4155'},
                            '50%': {textShadow: '0 0 12px #00ff41, 0 0 28px #00ff4188'},
                        },
                        glowRed: {
                            '0%,100%': {textShadow: '0 0 6px #ff2020, 0 0 12px #ff202055' },
                            '0%,100%': {textShadow: '0 0 16px #ff2020, 0 0 32px #ff202099' },
                        },
                        needleWobble: {
                            '0%,100%': { transform: 'rotate(-40deg)' },
                            '50%': { transform: 'rotate(-38deg)' },
                        },
                        shake: {
                            '0%,100%': { transform: 'translate(0,0) rotate(0deg)'},
                            '10%': {transform: 'translate(-4px, 2px) rotate(-0.5deg)'},
                            '30%': {transform: 'translate(4px, -3px) rotate(0.5deg)'},
                            '10%': {transform: 'translate(-3px, 4px) rotate(-0.3deg)'},
                            '10%': {transform: 'translate(3px, -2px) rotate(0.4deg)'},
                            '10%': {transform: 'translate(-2px, 2px) rotate(0deg)'},
                        },
                        fadeIn:{
                            from: {opacity: '0', transform: 'translateY(8px)'},
                            to: {opacity: '1', transform:'translateY(0)'},
                        },
                        tuneSlide: {
                            '0%': {transform: 'translateX(0)'},
                            '100%': {transform: 'translateX(calc(100% - 8px))'},
                        }
                    },
                    animation:{
                        scaline: 'scaline 5s linear infinite',
                        blink: 'blink 1s step-end infinite',
                        flicker: 'flicker 7s linear infinite',
                        glow: 'glow 2.5s ease-in-out infinite',
                        glowRed: 'glowRed 1s ease-in-out infinite',
                        needleWobble: 'needleWobble 3s ease-in-out infinite',
                        shake: 'shake 0.5s ease',
                        fadeIn: 'fadeIn 0.6s ease forwards',
                    }
                }
            }
        }
    </script>

    <link rel= "preconnect" href= "https://fonts.googleapis.com" />
    <link href= "https://fonts.googleapis.com/css2?family=VT323&family=Share+Tech+Mono&display=swap" rel= "stylesheet" />
    <link rel= "stylesheet" href="style.css" />
</head>

<body class="bg-void text-green font-body min-h-screen flex flex-col items-center justify-center overflow-hidden select-none relative">

    <div class= "crt-overlay pointer-events-none fixed inset-0 z-50"></div>
    <div class= "scaline-wrap pointer-events-none fixed inset-0 z-40 overflow-hidden">
        <div class= "scaline-bar"></div>
    </div>

    <div id= "boot-screen" class="fixed inset-0 z-30 bg-void flex flex-col items-center justify-center gap-6 px-6">
        <p class="font-mono text-green text-5x1 animate-glow tracking-widest">DEAD AIR</p>
        <p class="font-mono text-dgreen text-sm tracking-widest">EMERGENCY BRODCAST RECIEVER v2.1</p>
        <div clas="w-64 h-px bg-border mt-2"></div>
        <p class="font-mono text-fgreen text-xs tracking-widest animate-blink">[ PRESS ANY KEY TO INITIALIZE ]</p>
        <p class="font-mono text-ghost text-xs mt-8 max-w-xs text-center leading-relaxed">WARNING: Use headphones.<br/>This experience contains sudden loud sounds.</p>
    </div>

    <div id="radio-ui" class="hidden w-full max-w-lg px-4 py-8 flex-col gap-0 z-10 animate-flicker" style="animation-duration: 9s;">
        <div class="border border-border bg-panel px-5 py-3 flex items-centerjust justify-between">
            <span class="font-mono text-dgreen text-xs tracking-widest">EMERGENCY BRODCAST SYSTEM</span>
            <span class="font-mono text-xs texxxt-ghost" id="clock-display">--:--:--</span>
        </div>

        <div class="border-x border-border bg-crt px-5 py-6 flex flex-col items-center gap-2">
            <p class="font-mono text-ghost text-xs tracking-widest mb-1">FREQUENCY</p>
            <p class="font-mono text-green text-6x1 tracking-tight animate-glow" id="freq-display">87.3</p>
            <p class="font-mono text-dgreen text-sm tracking-widest">FM</p>

            <div class="flex items-end gap-1 mt-4 h-8"></div>
              <div class="signal-bar bg-fgreen w-2" style="height:30%;" id="sig0"></div>
              <div class="signal-bar bg-fgreen w-2" style="height:45%;" id="sig1"></div>
              <div class="signal-bar bg-fgreen w-2" style="height:60%;" id="sig2"></div>
              <div class="signal-bar bg-fgreen w-2" style="height:78%;" id="sig3"></div>
              <div class="signal-bar bg-fgreen w-2" style="height:100%;" id="sig4"></div>
        </div>
        <p class="font=mono text-fgreen text-[10px] tracking-widest mt-1" id="signal-label">NO SIGNAL</p>
    </div>

    <div class="border-x border-border bg-panel px-5 py-4">
        <div class="flex items-center justify-between mb-2">
            <span class="font-mono text-ghost text-[10px]">87.5</span>
            <span class="font-mono text-ghost textp-[10px]">108.0</span>
        </div>
        <div class="relative w-full h-2 bg-void border border-border rounded-none cursor-pointer" id="tuner-track">
            <div class="absolute top-1/2 -translate-y-12 w-3 h-5 bg-green cursor-grab active: cursor-grabbing" id="tuner-thumb" style="left: 0;"></div>
        </div>
    </div>
        <p class="font-mono text-ghost text-[10px] text-center mt-2">Drag to tune</p>
    </div>

    <div class="border-x border-t border-border bg-crt px-5 py-3">
        <div class="flex items-end gap-[2px] h-8" id="vu-meter"></div>
    </div>

    <div class="border border-border bg-void pc-5 py-4 min-h-[180px] max-h-[180px] overflow-hidden flex flex-col relative" id="log-panel">
        <p class="font-mono text-ghost text-[10px] tracking-widest mb-3">SIGNAL LOG</p>
        <div class="flex flex-col gap-1 overflow-hidden flex-1" id="log-lines"></div>
        <span class="font-mono text-green text-sm animate-blink absolute bottom-4 left-5" id="log-cursor">█</span>
    </div>

    <div class="border border-border border-t-0 bg-panel px-5 py-3 flex-items-center justify-between">
        <div class="flex gap-4">
            <button class="font-mono text-xs text-dgreen hover:text-green transition-colors tracking-widest" id="btn-squelch" onclick="window.RADIO.toggleSquelch()">SQUELCH: ON</button>
            <button class="font-mono text-xs text-dgreen hover:text-green transition-colors tracking-widest" id="btn-scan" onclick="window.RADIO.startScan()">SCAN</button>
        </div>
        <div class="flex gap-2 items-center">
            <div class="w-2 h-2 rounded-full bg-fgreen" id="pwr-led"></div>
            <span class="font-mono text-ghost text-[10px]">PWR</span>
        </div>
    </div>

    <div id="horror-overlay" class="hidden fixed inset-0 z-20 bg-void flex-col items-center justify-center px-8 gap-6">
        
    </div>
</body>
</html>
