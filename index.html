<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
    <title>DEAD AIR — 87.3 FM</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config= {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"VT323"', '"Courier New"','monospace'],
                        body: ['"Share Tech Mono"', 'monospace'],
                    },
                    colors: {
                        void: '#050508',
                        crt: '#0a0d0f',
                        panel: '#0d1117',
                        border: '#1a2030',
                        dim: '#1e2d1e',
                        green: '#00ff410',
                        dgreen: '#00aa2a',
                        fgreen: '#005c17',
                        red: '#ff2020',
                        amber: '#ffaa00',
                        ghost: '334433',
                    },
                    Keyframes: {
                        scaline: {
                            '0%': {top: '-10%' },
                            '100%': {top: '110%'},
                        },
                        blink: {
                            '0%,49%': {opacity: '1'},
                            '50%,100%': {opacity: '0'},
                        },
                        flicker: {
                            '0%,100%': {opacity: '1'},
                            '92%': {opacity: '1'},
                            '93%': {opacity: '0.4'},
                            '94%': {opacity: '1'},
                            '96%': {opacity: '0.7'},
                            '97%': {opacity: '1'},
                        },
                        glow: {
                            '0%,100%': {textShadow: '0 0 6px #00ff41, 0 0 12px #00ff4155'},
                            '50%': {textShadow: '0 0 12px #00ff41, 0 0 28px #00ff4188'},
                        },
                        glowred: {
                            '0%,100%': {textShadow: '0 0 6px #ff2020, 0 0 12px #ff202055' },
                            '0%,100%': {textShadow: '0 0 16px #ff2020, 0 0 32px #ff202099' },
                        },
                        needleWobble: {
                            '0%,100%': { transform: 'rotate(-40deg)' },
                            '50%': { transform: 'rotate(-38deg)' },
                        },
                    }
                }
            }
        }
    </script>
</head>
